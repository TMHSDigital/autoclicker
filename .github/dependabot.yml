version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Every pin in both locks, direct and transitive: runtime transitives ship
    # inside the exe, and a CVE in a dev-only transitive pin fails the audit
    # step, so all of them need bump PRs (#152).
    allow:
      - dependency-type: "all"
    groups:
      runtime-transitive:
        patterns:
          - "mouseinfo"
          - "pygetwindow"
          - "pymsgbox"
          - "pyperclip"
          - "pyrect"
          - "pyscreeze"
          - "pytweening"
          - "six"
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"
          - "coverage*"
          - "pre-commit*"
          - "pip-audit*"
          - "pyinstaller*"

  # Hook revs in .pre-commit-config.yaml. A ruff or mypy bump here should land
  # with the same version in requirements-dev-lock.txt (see CONTRIBUTING.md).
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
