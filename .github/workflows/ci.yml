name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  lint:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install, lint, and typecheck
        run: |
          tasks.bat install
          tasks.bat lint
          tasks.bat typecheck

      - name: Audit locked dependencies for known vulnerabilities
        run: tasks.bat audit

  test:
    runs-on: windows-2025
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: tasks.bat install

      - name: Unit tests
        run: tasks.bat test

      - name: Smoke check
        if: matrix.python-version == '3.11'
        run: tasks.bat smoke

      - name: Coverage report
        if: matrix.python-version == '3.11'
        run: tasks.bat coverage

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    runs-on: windows-2025
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: tasks.bat install

      - name: Build executable
        run: .venv\Scripts\pyinstaller.exe --clean --noconfirm WindowsAutoclicker.spec

      - name: Smoke-launch the frozen exe
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "smoke-appdata"
          $p = Start-Process -FilePath dist\WindowsAutoclicker.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "WindowsAutoclicker.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\WindowsAutoclicker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WindowsAutoclicker.exe" | Out-File -Encoding ascii dist\WindowsAutoclicker.exe.sha256
          Get-Content dist\WindowsAutoclicker.exe.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WindowsAutoclicker-${{ github.run_number }}
          path: dist/

  release:
    runs-on: windows-2025
    needs: [test, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WindowsAutoclicker-${{ github.run_number }}
          path: dist/

      - name: Release notes from this version's CHANGELOG section
        # Fails if the tag does not match autoclicker.__version__ or has no section.
        run: python scripts/release_notes.py ${{ github.ref_name }} --output release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/WindowsAutoclicker.exe

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/WindowsAutoclicker.exe
            dist/WindowsAutoclicker.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the Scoop and winget manifests on main
        # Keeps bucket/ (installable with scoop) and packaging/winget/ current.
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main
          $hash = (Get-Content dist\WindowsAutoclicker.exe.sha256).Split(' ')[0]
          $version = $env:TAG.TrimStart('v')
          python tools/package_manifests.py $version $hash
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(packaging): Scoop and winget manifests for $version"
            git push origin main
          }
