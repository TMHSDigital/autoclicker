name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Docs-only commits skip the pipeline. Path filters never apply to tag
    # pushes, so a release tag always runs everything (#110).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  lint:
    runs-on: windows-2025
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install, lint, and typecheck
        run: |
          tasks.bat install
          tasks.bat lint
          tasks.bat typecheck

      - name: Audit locked dependencies for known vulnerabilities
        run: tasks.bat audit

  test:
    runs-on: windows-2025
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: tasks.bat install

      - name: Unit tests
        # Coverage is measured and gated (--cov-fail-under in pyproject) on every Python.
        run: tasks.bat test

      - name: Smoke check
        if: matrix.python-version == '3.11'
        run: tasks.bat smoke

  real-input:
    # Drives the real mouse and keyboard against test windows (tests/integration).
    runs-on: windows-2025
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: tasks.bat install

      - name: Real input tests
        env:
          AUTOCLICKER_REAL_INPUT: "1"
        run: .venv\Scripts\python.exe -m pytest tests/integration --no-cov -v -p no:cacheprovider

  build:
    runs-on: windows-2025
    needs: test
    permissions:
      contents: read
      id-token: write  # OIDC login for code signing on release tags

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: tasks.bat install

      - name: Build executable
        run: .venv\Scripts\pyinstaller.exe --clean --noconfirm WindowsAutoclicker.spec

      # Code signing (Azure Artifact Signing) runs on release tags once the
      # repository variables below are set; until then releases stay unsigned.
      # Setup is described in docs/RELEASING.md.
      - name: Azure login for code signing
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ACCOUNT_NAME != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the executable
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ACCOUNT_NAME != ''
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signature
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNING_ACCOUNT_NAME != ''
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature dist\WindowsAutoclicker.exe
          if ($sig.Status -ne 'Valid') { Write-Error "Signature status: $($sig.Status)"; exit 1 }
          "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Smoke-launch the frozen exe
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "smoke-appdata"
          $p = Start-Process -FilePath dist\WindowsAutoclicker.exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "WindowsAutoclicker.exe exited early (code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\WindowsAutoclicker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WindowsAutoclicker.exe" | Out-File -Encoding ascii dist\WindowsAutoclicker.exe.sha256
          Get-Content dist\WindowsAutoclicker.exe.sha256

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WindowsAutoclicker-${{ github.run_number }}
          path: dist/

  release:
    runs-on: windows-2025
    # real-input is the only job that drives actual input; it gates releases too (#106).
    needs: [test, real-input, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        # The scripts below are stdlib-only, but not on whatever the runner image ships.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WindowsAutoclicker-${{ github.run_number }}
          path: dist/

      - name: Release notes from this version's CHANGELOG section
        # Fails if the tag does not match autoclicker.__version__ or has no section.
        run: python scripts/release_notes.py ${{ github.ref_name }} --output release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/WindowsAutoclicker.exe

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/WindowsAutoclicker.exe
            dist/WindowsAutoclicker.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the Scoop and winget manifests on main
        # Keeps bucket/ (installable with scoop) and packaging/winget/ current.
        # The tool checks what it wrote and fails before committing (#109); this
        # bot commit never runs CI. If this step fails after the release is
        # published, rerun it with the "Package manifests" workflow.
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --depth 50 origin main
          git checkout -B main origin/main
          $hash = (Get-Content dist\WindowsAutoclicker.exe.sha256).Split(' ')[0]
          $version = $env:TAG.TrimStart('v')
          python tools/package_manifests.py $version $hash
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket packaging
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "chore(packaging): Scoop and winget manifests for $version"
          # main may have moved since the fetch; rebase onto it and try again.
          foreach ($attempt in 1..3) {
            git push origin main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            git pull --rebase origin main
          }
          exit 1
