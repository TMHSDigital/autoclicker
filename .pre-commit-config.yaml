# Opt-in: pre-commit install (see CONTRIBUTING.md)
minimum_pre_commit_version: "3.2.0"  # pre-commit-hooks 5+ needs it
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Keep the ruff and mypy revs in step with requirements-dev-lock.txt so
  # pre-commit and CI run the same versions.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 25bcf95026b96e2dd3c0aec3090c3d6ef6ca2e6c # v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c # v2.4.1
    hooks:
      - id: mypy
        files: ^autoclicker/
        additional_dependencies: []
        args: [--config-file=pyproject.toml]
