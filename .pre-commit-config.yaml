# Opt-in: pre-commit install (see CONTRIBUTING.md)
minimum_pre_commit_version: "3.2.0"  # pre-commit-hooks 5+ needs it
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # Keep the ruff and mypy revs in step with requirements-dev-lock.txt so
  # pre-commit and CI run the same versions.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253 # v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 2834ec6639549dd6796205c8f011dedcd587288b # v2.4.0
    hooks:
      - id: mypy
        files: ^autoclicker/
        additional_dependencies: []
        args: [--config-file=pyproject.toml]
